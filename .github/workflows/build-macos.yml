name: Build macOS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore: ['**.md', 'docs/**', 'wiki/**']
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal (ARM64 & x86_64)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DRB26_BUILD_TESTS=OFF

      - name: Compile Release Targets
        run: |
          cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Determine Version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#v}"
          else
            VERSION=$(grep '"version":' package.json | head -n 1 | sed -E 's/.*"version": "([^"]+)".*/\1/')
            TAG_NAME="v${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "Building for Version: ${VERSION} (Tag: ${TAG_NAME})"

      - name: Package Distribution Zip
        run: |
          mkdir -p package/VST3 package/CLAP package/AU package/Standalone
          echo "Listing generated build artefacts:"
          find build -name "*.vst3" -o -name "*.component" -o -name "*.clap" -o -name "*.app" || true

          for d in $(find build -type d -name "BRAUN_RB26.vst3"); do
            echo "Copying VST3 from $d"
            cp -R "$d" package/VST3/
            break
          done

          for d in $(find build -type d -name "BRAUN_RB26.component"); do
            echo "Copying AU from $d"
            cp -R "$d" package/AU/
            break
          done

          for f in $(find build -type f -name "BRAUN_RB26.clap"); do
            echo "Copying CLAP from $f"
            cp "$f" package/CLAP/
            break
          done

          for d in $(find build -type d -name "BRAUN_RB26.app"); do
            echo "Copying Standalone from $d"
            cp -R "$d" package/Standalone/
            break
          done

          # Sanity check: Ensure required binaries were packaged
          if [ ! -d "package/VST3/BRAUN_RB26.vst3" ]; then
            echo "Error: BRAUN_RB26.vst3 was not copied into package!" >&2
            exit 1
          fi
          if [ ! -d "package/AU/BRAUN_RB26.component" ]; then
            echo "Error: BRAUN_RB26.component was not copied into package!" >&2
            exit 1
          fi
          if [ ! -f "package/CLAP/BRAUN_RB26.clap" ]; then
            echo "Error: BRAUN_RB26.clap was not copied into package!" >&2
            exit 1
          fi
          if [ ! -d "package/Standalone/BRAUN_RB26.app" ]; then
            echo "Error: BRAUN_RB26.app was not copied into package!" >&2
            exit 1
          fi

          # Copy easy-run scripts into package root and grant execute permissions
          if [ -d "scripts/macos" ]; then
            echo "Copying macOS easy-run helper scripts..."
            cp scripts/macos/*.command package/ 2>/dev/null || true
            chmod +x package/*.command 2>/dev/null || true
          fi

          [ -f LICENSE ] && cp LICENSE package/
          [ -f README.md ] && cp README.md package/

          ZIP_NAME="BRAUN_RB26-v${VERSION}-macOS-Universal.zip"
          echo "Creating distribution archive: ${ZIP_NAME}"
          cd package
          zip -r "../${ZIP_NAME}" *
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRAUN_RB26-v${{ env.VERSION }}-macOS-Universal
          path: ${{ env.ZIP_NAME }}

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if the release exists on GitHub before uploading
          if gh release view "${TAG_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} exists. Uploading release asset ${ZIP_NAME}..."
            for attempt in 1 2 3; do
              if gh release upload "${TAG_NAME}" "${ZIP_NAME}" --repo "${{ github.repository }}" --clobber; then
                echo "Upload succeeded!"
                exit 0
              fi
              echo "Upload attempt $attempt failed, retrying in 10s..."
              sleep 10
            done
            exit 1
          else
            echo "Release ${TAG_NAME} does not exist yet on GitHub. Asset is preserved in workflow artifacts."
          fi
