name: Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit & DSP Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Web Audio Test Suite
        run: npm run verify:all

      - name: Install Linux Build Dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://ubuntu.osuosl.org/ubuntu/\tpriority:1\nhttps://mirrors.mit.edu/ubuntu/\tpriority:2\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:3\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo sed -i -E 's|https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu|https://ubuntu.osuosl.org/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 install -y --no-install-recommends \
            ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libgl-dev \
            libcurl4-openssl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev

      - name: Configure CMake (Native Linux Headless C++ Tests)
        run: |
          cmake -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DRB26_USE_WEBVIEW=OFF -DRB26_BUILD_TESTS=ON

      - name: Build Headless C++ DSP & Standalone Guard Test Runners
        run: |
          cmake --build build-ci --target rb26_headless_dsp_tests rb26_standalone_audio_guard_tests --config Release -j$(nproc)

      - name: Run Headless C++ DSP & Standalone Guard Verification Suites
        run: |
          ctest --test-dir build-ci --output-on-failure -R "Rb26HeadlessDspTests|Rb26StandaloneAudioGuardTests"
