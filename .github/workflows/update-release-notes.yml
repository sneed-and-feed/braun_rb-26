name: Update Release Notes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/release-notes-v1.3.8.md'

permissions:
  contents: write

jobs:
  update-notes:
    name: Update v1.3.8 Release Notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Release Notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.3.8 --notes-file .github/release-notes-v1.3.8.md
